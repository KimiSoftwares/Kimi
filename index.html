<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimi Chat Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-2">
            <span class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">Kimi Chat Hub</span>
        </div>
        <div id="user-menu" class="hidden flex items-center space-x-4">
            <span id="current-username" class="text-sm text-slate-300 font-medium"></span>
            <button onclick="logout()" class="bg-rose-600 hover:bg-rose-700 text-white text-xs px-3 py-1.5 rounded-lg transition">Logout</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 flex items-center justify-center p-4">

        <!-- AUTH SCREEN (Login / Register) -->
        <div id="auth-screen" class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
            <div class="flex border-b border-slate-800 mb-6">
                <button id="tab-login" onclick="switchTab('login')" class="flex-1 pb-3 text-center font-semibold text-indigo-400 border-b-2 border-indigo-500 transition">Login</button>
                <button id="tab-register" onclick="switchTab('register')" class="flex-1 pb-3 text-center font-semibold text-slate-400 border-b-2 border-transparent transition">Register</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Username</label>
                    <input type="text" id="login-user" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Password</label>
                    <input type="password" id="login-pass" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
                </div>
                <p id="login-error" class="text-rose-500 text-xs hidden"></p>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition">Login</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Choose Username</label>
                    <input type="text" id="reg-user" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Choose Password</label>
                    <input type="password" id="reg-pass" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
                </div>
                <p id="reg-error" class="text-rose-500 text-xs hidden"></p>
                <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-medium py-2 rounded-lg transition">Create Account</button>
            </form>
        </div>

        <!-- CHAT SCREEN -->
        <div id="chat-screen" class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-xl flex flex-col h-[75vh] shadow-xl hidden">
            <!-- Message List -->
            <div id="message-container" class="flex-1 p-4 overflow-y-auto space-y-3">
                <!-- Dynamic messages populate here -->
            </div>

            <!-- Message Input Form -->
            <form onsubmit="handleSendMessage(event)" class="p-3 bg-slate-900/50 border-t border-slate-800 flex gap-2">
                <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off" required class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg font-medium transition">Send</button>
            </form>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-800">
        Kimi Chat Hub &bull; LocalStorage Powered
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Check active session on load
        let currentUser = localStorage.getItem('kimi_current_user');

        window.addEventListener('DOMContentLoaded', () => {
            if (currentUser) {
                showChatScreen();
            } else {
                showAuthScreen();
            }
        });

        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-register');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                tabLogin.className = "flex-1 pb-3 text-center font-semibold text-indigo-400 border-b-2 border-indigo-500 transition";
                tabReg.className = "flex-1 pb-3 text-center font-semibold text-slate-400 border-b-2 border-transparent transition";
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                tabReg.className = "flex-1 pb-3 text-center font-semibold text-cyan-400 border-b-2 border-cyan-500 transition";
                tabLogin.className = "flex-1 pb-3 text-center font-semibold text-slate-400 border-b-2 border-transparent transition";
            }
        }

        function getUsers() {
            return JSON.parse(localStorage.getItem('kimi_users') || '{}');
        }

        function handleRegister(e) {
            e.preventDefault();
            const user = document.getElementById('reg-user').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();
            const errorEl = document.getElementById('reg-error');

            let users = getUsers();
            if (users[user]) {
                errorEl.textContent = "Username already exists.";
                errorEl.classList.remove('hidden');
                return;
            }

            users[user] = pass;
            localStorage.setItem('kimi_users', JSON.stringify(users));
            
            // Auto login after register
            localStorage.setItem('kimi_current_user', user);
            currentUser = user;
            showChatScreen();
        }

        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            const errorEl = document.getElementById('login-error');

            let users = getUsers();
            if (!users[user] || users[user] !== pass) {
                errorEl.textContent = "Invalid username or password.";
                errorEl.classList.remove('hidden');
                return;
            }

            localStorage.setItem('kimi_current_user', user);
            currentUser = user;
            showChatScreen();
        }

        function logout() {
            localStorage.removeItem('kimi_current_user');
            currentUser = null;
            showAuthScreen();
        }

        function showAuthScreen() {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('chat-screen').classList.add('hidden');
            document.getElementById('user-menu').classList.add('hidden');
            // Reset forms
            document.getElementById('login-form').reset();
            document.getElementById('register-form').reset();
            document.getElementById('login-error').classList.add('hidden');
            document.getElementById('reg-error').classList.add('hidden');
        }

        function showChatScreen() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            document.getElementById('user-menu').classList.remove('hidden');
            document.getElementById('current-username').textContent = `Logged in as: ${currentUser}`;
            loadMessages();
        }

        function getMessages() {
            return JSON.parse(localStorage.getItem('kimi_messages') || '[]');
        }

        function loadMessages() {
            const container = document.getElementById('message-container');
            const messages = getMessages();
            container.innerHTML = '';

            if (messages.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 text-sm mt-10">No messages yet. Start the conversation!</div>`;
                return;
            }

            messages.forEach(msg => {
                const isMe = msg.user === currentUser;
                const bubble = document.createElement('div');
                bubble.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
                
                bubble.innerHTML = `
                    <span class="text-[10px] text-slate-400 mb-0.5 px-1">${msg.user} &bull; ${msg.time}</span>
                    <div class="max-w-[75%] rounded-2xl px-4 py-2 text-sm ${isMe ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-200 rounded-bl-none border border-slate-700'}">${escapeHtml(msg.text)}</div>
                `;
                container.appendChild(bubble);
            });

            container.scrollTop = container.scrollHeight;
        }

        function handleSendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const messages = getMessages();
            
            messages.push({ user: currentUser, text: text, time: time });
            localStorage.setItem('kimi_messages', JSON.stringify(messages));

            input.value = '';
            loadMessages();
        }

        // Basic safety against HTML injection in chats
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
